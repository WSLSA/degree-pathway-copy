<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WSLSA 2027 Pathway Explorer</title>
<meta name="description" content="Interactive 2027 degree pathway explorer and PDF guide generator for Western Sydney University law students, built from the WSLSA 2027 Degree Guides workbook.">
<meta name="theme-color" content="#7D0028">
<meta property="og:type" content="website">
<meta property="og:title" content="WSLSA 2027 Pathway Explorer">
<meta property="og:description" content="Plan your WSU law degree session by session: pick majors and LLB Alternates, check campus and prerequisite warnings, and export a PDF degree guide.">
<meta property="og:url" content="@@SITE_URL@@/">
<meta property="og:image" content="@@SITE_URL@@/og-image.png">
<meta property="og:image:alt" content="Western Sydney Law Students' Association logo">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="64x64" href="@@FAVICON@@">
<link rel="apple-touch-icon" href="@@TOUCH_ICON@@">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/*@@STYLES@@*/
</style>
<style>
/*@@PRINT_STYLES@@*/
</style>
<style>:root { --crest-img: url("@@CREST@@"); }</style>
<style id="page-size">@page { size: A4 portrait; margin: 10mm; }</style>
</head>
<body>
<div class="app" id="app">
  <a class="skip-link" href="#plan-heading" data-action="skip">Skip to your plan</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="crest" href="#" data-action="top" aria-label="Western Sydney Law Students' Association, 2027 Degree Pathway Explorer, back to top">
        <span class="crest-img brand-crest" role="img" aria-label="WSLSA crest"></span>
        <span class="crest-text"><span class="ct-ws">Western Sydney</span><span class="ct-lsa">Law Students' Association</span><small>Est. 1996 · Degree Pathway Explorer</small></span>
      </a>
      <button type="button" class="tbtn top-menu-btn" data-action="top-menu" aria-expanded="false" aria-controls="top-actions">Menu</button>
      <nav class="top-actions" id="top-actions" aria-label="Plan actions">
        <a class="tbtn top-link" href="https://wslsa.com.au/" target="_blank" rel="noopener">wslsa.com.au ↗</a>
        <button type="button" class="tbtn" data-action="share" title="Copy a link that restores this exact plan on any device">Copy Share Link</button>
        <button type="button" class="tbtn top-quiet" data-action="reset" title="Clear choices and progress for this pathway">Reset Plan</button>
        <button type="button" class="tbtn" data-action="export-open" title="Choose guide type, orientation and LLB Alternate filters, with a live A4 preview">PDF Options</button>
        <button type="button" class="tbtn tbtn-primary" data-action="print">Print / Save PDF →</button>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="notice" id="notice" aria-label="School of Law update"></section>

    <section class="hero-band" aria-labelledby="hero-title">
      <span class="hero-watermark crest-rev" aria-hidden="true"></span>
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="hero-app"><b>2027</b> Degree Pathway Explorer</p>
          <h1 id="hero-title">Degree Pathway Explorer</h1>
          <div class="hero-meta" id="hero-meta"></div>
        </div>
        <div class="hero-seal" aria-hidden="true">
          <span class="crest-rev hero-crest"></span>
          <span class="hero-est">Est. 1996 · By students, for students</span>
        </div>
      </div>
    </section>

    <section class="dock" id="dock-wrap" aria-label="Choose your degree and track progress">
      <div class="wrap"><div class="dock-card" id="dock"></div></div>
    </section>

    <div class="wrap stack">
      <section class="ribbon" id="facts" aria-label="Key facts"></section>
      <section id="advisory" aria-label="Pathway advisory"></section>
      <section id="next" aria-label="Next to enrol"></section>
      <div class="section-head">
        <div>
          <p class="kicker" id="section-kicker">Recommended pathway <i>·</i> 2027</p>
          <h2 id="plan-heading" tabindex="-1">Your degree, session by session</h2>
        </div>
        <div class="section-tools" id="section-tools"></div>
      </div>
      <div class="plan-body">
        <section class="gridbar" id="gridbar" aria-label="Filter your plan">
          <div class="segmented view-modes" role="group" aria-label="What to show in your plan">
            <button type="button" data-action="grid-view" data-view="all" aria-pressed="true">All</button>
            <button type="button" data-action="grid-view" data-view="remaining" aria-pressed="false" title="Hide finished subjects and fold finished years">Remaining<span class="wide-only"> only</span><span class="gv-count" id="gv-remaining"></span></button>
            <button type="button" data-action="grid-view" data-view="action" aria-pressed="false" title="Show only open choices, unpublished sessions, campus mismatches, prerequisite notes and offering warnings">Action<span class="wide-only"> needed</span><span class="gv-count" id="gv-action"></span></button>
          </div>
          <div class="grid-search">
            <input class="input" id="grid-q" type="search" placeholder="Press / to filter grid" aria-label="Filter your plan by subject code or title" autocomplete="off">
            <span class="grid-status" id="grid-status" role="status"></span>
          </div>
          <section class="micro-legend" id="legend" aria-label="Legend"></section>
        </section>
        <nav class="dmap" id="dmap" aria-label="Jump to a year or session in your plan"></nav>
        <div class="plan-empty" id="grid-empty" hidden></div>
        <section class="grid" id="grid" aria-label="Recommended pathway"></section>
      </div>
      <section class="drawer" id="details" aria-label="Degree details"></section>
    </div>
  </main>

  <footer class="site-footer" id="site-foot"></footer>

  <div class="mini-bar" id="mini-bar" role="region" aria-label="Your credit point progress">
    <button type="button" class="mini-toggle" data-action="mini-toggle" aria-expanded="true" aria-controls="mini-track" aria-label="Collapse progress bar"></button>
    <span class="mini-num" id="mini-num"></span>
    <span class="bar" id="mini-track" role="progressbar" aria-valuemin="0" aria-label="Credit points completed"><span id="mini-fill"></span></span>
    <button type="button" class="mini-undo" data-action="undo" aria-label="Undo" disabled>↶</button>
    <button type="button" class="mini-top" data-action="mini-top">Controls ↑</button>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="xray-note" role="status" aria-live="polite" hidden></div>
<div id="print-root" aria-hidden="true"></div>

<script type="application/json" id="wslsa-data">@@DATA@@</script>
<script>
/*@@APP@@*/
</script>
</body>
</html>
