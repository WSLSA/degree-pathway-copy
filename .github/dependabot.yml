# Keeps Playwright (the test browsers) and the steps the workflows use up to date. Each update arrives as a pull
# request, which the checks run on before anything is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      playwright:
        patterns: ["playwright*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
