# Every Monday morning (Sydney time): opens the live site in Chromium, Safari's engine and Firefox and walks through
# what a student does most, and checks every outside link the explorer gives (Handbook pages, dates, WSLSA). If anything
# fails, it opens an issue, or adds to the one already open, so a broken Handbook link or a browser update is noticed.
name: Weekly live site check

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit firefox

      - name: Walk through the live site in every engine
        id: walk
        continue-on-error: true
        env:
          APP_URL: https://wslsa.github.io/degree-pathway-copy/
        run: node tests/browsers.cjs 2>&1 | tee walk.txt

      - name: Check every outside link
        id: links
        continue-on-error: true
        run: node tests/links.cjs 2>&1 | tee links.txt

      - name: Keep screenshots of what failed
        if: steps.walk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: live-screenshots
          path: test-results/
          retention-days: 30

      - name: Open or update an issue
        if: steps.walk.outcome == 'failure' || steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly check of the live site found a problem. [Run log and screenshots]($RUN_URL)"
            echo
            if [ "${{ steps.walk.outcome }}" = "failure" ]; then echo "### In the browsers"; echo '```'; grep -E "^FAIL|checks passed" walk.txt | head -n 40; echo '```'; fi
            if [ "${{ steps.links.outcome }}" = "failure" ]; then echo "### Links"; echo '```'; grep -E "^FAIL|^WARN|checked" links.txt | head -n 40; echo '```'; fi
          } > body.md
          gh label create live-check --color B60205 --description "Found by the weekly live site check" 2>/dev/null || true
          open=$(gh issue list --label live-check --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file body.md; else gh issue create --title "Weekly live site check found a problem" --label live-check --body-file body.md; fi
          exit 1
